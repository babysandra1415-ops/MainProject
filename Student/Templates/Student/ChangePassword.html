{% extends 'Student/head.html' %}
{% block content %}

<style>
    .password-container{
        min-height:85vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f2f4f8;
        padding:20px;
    }

    .password-card{
        background:#fff;
        width:400px;
        padding:35px 40px;
        border-radius:16px;
        box-shadow:0 8px 25px rgba(0,0,0,0.12);
    }

    .password-card h1{
        text-align:center;
        margin-bottom:25px;
        font-size:24px;
        font-weight:600;
        color:#333;
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    td{
        padding:10px 0;
        border:none;
    }

    td:first-child{
        font-weight:600;
        color:#444;
        width:40%;
    }

    input[type="password"]{
        width:100%;
        padding:10px 12px;
        border-radius:8px;
        border:1px solid #dcdcdc;
        outline:none;
        font-size:14px;
        transition:0.2s;
    }

    input[type="password"]:focus{
        border-color:#4e73df;
        box-shadow:0 0 0 2px rgba(78,115,223,0.15);
    }

    input[type="submit"]{
        margin-top:15px;
        width:100%;
        padding:11px;
        border:none;
        border-radius:8px;
        background:#e74a3b;
        color:white;
        font-weight:600;
        font-size:15px;
        cursor:pointer;
        transition:0.2s;
    }

    input[type="submit"]:hover{
        background:#c0392b;
    }
</style>


<div class="password-container">
<div class="password-card">

<form action="" method="post">
    {% csrf_token %}
    <h1>Change Password</h1>

    <table>
        <tr>
            <td>Old Password</td>
            <td>
                <input type="password" name="txt_opassword" id="txt_opassword" placeholder="Old Password" required>
            </td>
        </tr>

        <tr>
            <td>New Password</td>
            <td>
                <input type="password" name="txt_npassword" id="txt_npassword"
                placeholder="New Password"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                title="Must contain at least one number, one uppercase, one lowercase letter, and at least 8 characters"
                required>
            </td>
        </tr>

        <tr>
            <td>Confirm Password</td>
            <td>
                <input type="password" name="txt_cpassword" id="txt_cpassword" placeholder="Confirm Password" required>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Change">
            </td>
        </tr>
    </table>
</form>

</div>
</div>


{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Student:MyProfile' %}";
</script>
{% endif %}

{% if msg1 %}
<script>
    alert("{{msg1}}")
    window.location="{% url 'Student:MyProfile' %}";
</script>
{% endif %}

{% if msg2 %}
<script>
    alert("{{msg2}}")
    window.location="{% url 'Student:MyProfile' %}";
</script>
{% endif %}

{% endblock %}
